<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4A0080"/><stop offset="100%" style="stop-color:#7B1FA2"/></linearGradient>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <rect x="4" y="4" width="192" height="192" rx="18" fill="none" stroke="#E040FB" stroke-width="2"/>
  <!-- Crying laughing emoji style -->
  <circle cx="100" cy="80" r="55" fill="#FFD600" stroke="#F9A825" stroke-width="2.5"/>
  <!-- Closed laugh eyes with tears -->
  <path d="M 72 66 Q 85 55 98 66" fill="#E65100" stroke="#BF360C" stroke-width="2"/>
  <path d="M 102 66 Q 115 55 128 66" fill="#E65100" stroke="#BF360C" stroke-width="2"/>
  <!-- Tear streams -->
  <path d="M 72 68 Q 64 88 68 105" fill="none" stroke="#4FC3F7" stroke-width="4" stroke-linecap="round"/>
  <path d="M 128 68 Q 136 88 132 105" fill="none" stroke="#4FC3F7" stroke-width="4" stroke-linecap="round"/>
  <!-- Water drops -->
  <path d="M 68 105 Q 65 115 70 118 Q 75 115 72 105 Z" fill="#4FC3F7"/>
  <path d="M 130 105 Q 127 115 132 118 Q 137 115 134 105 Z" fill="#4FC3F7"/>
  <!-- Big open laugh mouth -->
  <path d="M 65 95 Q 100 130 135 95" fill="#E65100" stroke="#BF360C" stroke-width="2"/>
  <ellipse cx="100" cy="115" rx="28" ry="18" fill="#333"/>
  <!-- Tongue -->
  <ellipse cx="100" cy="120" rx="14" ry="10" fill="#FF5252"/>
  <!-- Rosy cheeks -->
  <circle cx="68" cy="98" r="10" fill="#FF8A65" opacity="0.5"/>
  <circle cx="132" cy="98" r="10" fill="#FF8A65" opacity="0.5"/>
  <text x="100" y="162" text-anchor="middle" font-family="Impact,sans-serif" font-size="16" font-weight="900" fill="#FFD600" filter="url(#s)">💀 I'M DEAD 💀</text>
  <text x="100" y="186" text-anchor="middle" font-family="Impact,sans-serif" font-size="12" font-weight="900" fill="#E040FB" filter="url(#s)">sent me 😂😂😂</text>
</svg>
