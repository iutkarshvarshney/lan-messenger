<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A237E"/><stop offset="100%" style="stop-color:#283593"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <rect x="4" y="4" width="192" height="192" rx="18" fill="none" stroke="#7C4DFF" stroke-width="2"/>
  <!-- Big brain expanding -->
  <ellipse cx="100" cy="55" r="45" ry="35" fill="#FFAB91" stroke="#333" stroke-width="2"/>
  <!-- Brain top (expanded) -->
  <path d="M 55 45 Q 55 10 100 5 Q 145 10 145 45" fill="#FF8A80" stroke="#E57373" stroke-width="1.5"/>
  <path d="M 65 35 Q 80 15 100 12 Q 120 15 135 35" fill="none" stroke="#E57373" stroke-width="1" opacity="0.5"/>
  <!-- Simple face -->
  <circle cx="85" cy="55" r="3" fill="#222"/><circle cx="115" cy="55" r="3" fill="#222"/>
  <path d="M 90 68 Q 100 74 110 68" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Glow around brain -->
  <circle cx="100" cy="35" r="55" fill="none" stroke="#7C4DFF" stroke-width="1.5" opacity="0.3"/>
  <circle cx="100" cy="35" r="65" fill="none" stroke="#B388FF" stroke-width="1" opacity="0.2"/>
  <!-- Stars -->
  <text x="20" y="30" font-size="14">⚡</text>
  <text x="165" y="30" font-size="14">⚡</text>
  <text x="30" y="80" font-size="12">✨</text>
  <text x="160" y="80" font-size="12">✨</text>
  <text x="100" y="120" text-anchor="middle" font-family="Impact,sans-serif" font-size="14" font-weight="900" fill="#B388FF" filter="url(#s)">GALAXY</text>
  <text x="100" y="145" text-anchor="middle" font-family="Impact,sans-serif" font-size="18" font-weight="900" fill="#fff" filter="url(#s)">BRAIN! 🧠</text>
  <text x="100" y="175" text-anchor="middle" font-family="Impact,sans-serif" font-size="10" font-weight="900" fill="#B388FF" filter="url(#s)">*intelligence 9999*</text>
</svg>
