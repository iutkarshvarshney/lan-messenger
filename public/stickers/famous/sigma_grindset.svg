<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0D1117"/><stop offset="100%" style="stop-color:#21262D"/></linearGradient>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/></filter>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" style="stop-color:#58A6FF;stop-opacity:0.3"/><stop offset="100%" style="stop-color:#58A6FF;stop-opacity:0"/></radialGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <circle cx="100" cy="90" r="75" fill="url(#glow)"/>
  <rect x="4" y="4" width="192" height="192" rx="18" fill="none" stroke="#58A6FF" stroke-width="1.5" opacity="0.5"/>
  <!-- Sigma chad face - chiseled jaw -->
  <path d="M 65 105 Q 62 75 70 52 Q 85 28 100 26 Q 115 28 130 52 Q 138 75 135 105 Q 128 130 100 135 Q 72 130 65 105 Z" fill="#D4A07A" stroke="#333" stroke-width="1.5"/>
  <!-- Strong jaw -->
  <path d="M 72 118 Q 100 138 128 118" fill="#C49070" stroke="#B07D5A" stroke-width="1.5"/>
  <!-- Half-closed sigma eyes -->
  <path d="M 73 68 L 93 68" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 107 68 L 127 68" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 73 72 Q 83 76 93 72" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
  <path d="M 107 72 Q 117 76 127 72" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
  <!-- Smug expression -->
  <path d="M 84 100 Q 100 108 116 100" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Chiseled cheekbones -->
  <path d="M 68 90 L 78 100" stroke="#B07D5A" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 132 90 L 122 100" stroke="#B07D5A" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Classy hair -->
  <path d="M 65 62 Q 70 32 100 26 Q 130 32 135 62" fill="#111"/>
  <path d="M 65 62 Q 68 50 75 58" fill="#222"/>
  <!-- SIGMA text with glow -->
  <text x="100" y="158" text-anchor="middle" font-family="Impact,sans-serif" font-size="26" font-weight="900" fill="#58A6FF" filter="url(#s)">SIGMA</text>
  <text x="100" y="182" text-anchor="middle" font-family="Impact,sans-serif" font-size="14" font-weight="900" fill="#fff" filter="url(#s)">GRINDSET 😤</text>
</svg>
