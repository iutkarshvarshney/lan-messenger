<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgAIW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0288D1"/>
      <stop offset="100%" style="stop-color:#01579B"/>
    </linearGradient>
    <filter id="sh4"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bgAIW)"/>
  <rect x="4" y="4" width="192" height="192" rx="18" fill="none" stroke="#4FC3F7" stroke-width="2" opacity="0.5"/>
  
  <!-- Hand on chest gesture -->
  <g transform="translate(100,55)">
    <!-- Body -->
    <path d="M -22 18 L -28 55 L 28 55 L 22 18 Z" fill="#1565C0" stroke="#0D47A1" stroke-width="1.5"/>
    <!-- Face -->
    <circle cx="0" cy="0" r="25" fill="#E8B88A" stroke="#333" stroke-width="2"/>
    <!-- Happy closed eyes -->
    <path d="M -12 -3 Q -8 -8 -4 -3" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 4 -3 Q 8 -8 12 -3" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Big smile -->
    <path d="M -10 8 Q 0 20 10 8" fill="#fff" stroke="#333" stroke-width="2"/>
    <path d="M -10 8 Q 0 12 10 8" fill="#333"/>
    <!-- Hair -->
    <path d="M -25 -8 Q -22 -28 0 -30 Q 22 -28 25 -8" fill="#222"/>
    <!-- Hand on chest -->
    <circle cx="0" cy="32" r="7" fill="#E8B88A" stroke="#333" stroke-width="1.5"/>
  </g>
  
  <!-- Musical notes -->
  <text x="25" y="35" font-size="18">🎵</text>
  <text x="160" y="45" font-size="16">🎶</text>
  <text x="35" y="180" font-size="14">✨</text>
  <text x="155" y="175" font-size="14">🌟</text>
  
  <!-- Heartbeat line -->
  <path d="M 20 125 L 50 125 L 55 115 L 60 135 L 65 115 L 70 135 L 75 125 L 180 125" fill="none" stroke="#4FC3F7" stroke-width="2" opacity="0.5"/>
  
  <!-- Text -->
  <text x="100" y="145" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="22" font-weight="900" fill="#fff" filter="url(#sh4)">AAL IZZ</text>
  <text x="100" y="172" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="24" font-weight="900" fill="#4FC3F7" filter="url(#sh4)">WELL! ✌️</text>
</svg>
