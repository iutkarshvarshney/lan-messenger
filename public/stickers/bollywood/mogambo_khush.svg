  <polygon points="28,30 35,50 30,48 38,70 25,45 30,47" fill="#E040FB" opacity="0.8"/>
  <polygon points="172,30 165,50 170,48 162,70 175,45 170,47" fill="#E040FB" opacity="0.8"/>
  
  <!-- Text -->
  <text x="100" y="130" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="14" font-weight="900" fill="#E040FB" filter="url(#sh1)">MOGAMBO</text>
  <text x="100" y="152" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="18" font-weight="900" fill="#fff" filter="url(#sh1)">KHUSH</text>
  <text x="100" y="174" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="18" font-weight="900" fill="#E040FB" filter="url(#sh1)">HUA! 😈</text>
