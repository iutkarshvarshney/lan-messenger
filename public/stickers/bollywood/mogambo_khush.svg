<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgMog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D0845"/>
      <stop offset="100%" style="stop-color:#6A0572"/>
    </linearGradient>
    <filter id="sh1"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bgMog)"/>
  <rect x="4" y="4" width="192" height="192" rx="18" fill="none" stroke="#E040FB" stroke-width="2" opacity="0.5"/>
  <!-- Villain face -->
  <circle cx="100" cy="68" r="38" fill="#D4A07A" stroke="#333" stroke-width="2"/>
  <!-- Evil eyes -->
  <ellipse cx="85" cy="62" rx="7" ry="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="115" cy="62" rx="7" ry="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="85" cy="63" r="4" fill="#222"/>
  <circle cx="115" cy="63" r="4" fill="#222"/>
  <circle cx="86" cy="62" r="1.5" fill="#fff"/>
  <circle cx="116" cy="62" r="1.5" fill="#fff"/>
  <!-- Evil eyebrows -->
  <path d="M 75 52 L 93 56" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 125 52 L 107 56" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Evil grin -->
  <path d="M 78 82 Q 100 100 122 82" fill="#fff" stroke="#333" stroke-width="2"/>
