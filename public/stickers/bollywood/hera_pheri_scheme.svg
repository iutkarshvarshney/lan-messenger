<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgHP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E65100"/>
      <stop offset="100%" style="stop-color:#FF8F00"/>
    </linearGradient>
    <filter id="sh3"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bgHP)"/>
  <rect x="4" y="4" width="192" height="192" rx="18" fill="none" stroke="#fff" stroke-width="2" opacity="0.4"/>
  
  <!-- Thinking face with glasses -->
  <circle cx="100" cy="65" r="36" fill="#E8B88A" stroke="#333" stroke-width="2"/>
  <!-- Big glasses -->
  <circle cx="84" cy="60" r="14" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="116" cy="60" r="14" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="98" y1="60" x2="102" y2="60" stroke="#333" stroke-width="3"/>
  <line x1="70" y1="60" x2="60" y2="55" stroke="#333" stroke-width="2.5"/>
  <line x1="130" y1="60" x2="140" y2="55" stroke="#333" stroke-width="2.5"/>
  <!-- Eyes looking up (scheming) -->
  <circle cx="84" cy="58" r="3" fill="#222"/>
  <circle cx="116" cy="58" r="3" fill="#222"/>
  <circle cx="85" cy="57" r="1" fill="#fff"/>
  <circle cx="117" cy="57" r="1" fill="#fff"/>
  <!-- Raised eyebrows -->
  <path d="M 72 44 Q 84 38 96 44" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 104 44 Q 116 38 128 44" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Scheming smile -->
  <path d="M 85 80 Q 100 90 115 80" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Mustache -->
  <path d="M 88 76 Q 94 80 100 76 Q 106 80 112 76" fill="#555" stroke="#333" stroke-width="1"/>
  <!-- Hair -->
  <path d="M 64 50 Q 68 28 100 22 Q 132 28 136 50" fill="#333"/>
  <!-- Hand on chin -->
  <g transform="translate(120,88)">
    <circle cx="0" cy="0" r="6" fill="#E8B88A" stroke="#333" stroke-width="1.5"/>
    <rect x="-3" y="0" width="10" height="4" rx="2" fill="#E8B88A" stroke="#333" stroke-width="1"/>
  </g>
  
  <!-- Lightbulb -->
  <g transform="translate(155,25)">
    <circle cx="0" cy="0" r="12" fill="#FFEB3B" stroke="#F9A825" stroke-width="1.5"/>
    <rect x="-4" y="10" width="8" height="5" rx="1" fill="#9E9E9E"/>
    <line x1="-2" y1="0" x2="2" y2="0" stroke="#F9A825" stroke-width="1.5"/>
    <line x1="0" y1="-2" x2="0" y2="2" stroke="#F9A825" stroke-width="1.5"/>
    <!-- Rays -->
    <line x1="0" y1="-15" x2="0" y2="-18" stroke="#FFEB3B" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="-8" x2="15" y2="-10" stroke="#FFEB3B" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="-8" x2="-15" y2="-10" stroke="#FFEB3B" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="128" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="11" font-weight="900" fill="#fff" filter="url(#sh3)">SABSE BADA</text>
  <text x="100" y="148" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="14" font-weight="900" fill="#FFEB3B" filter="url(#sh3)">RUPAIYA! 💡</text>
  <text x="100" y="172" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="10" font-weight="900" fill="#fff" filter="url(#sh3)">*scheming intensifies*</text>
  
  <text x="18" y="28" font-size="16">🤔</text>
  <text x="18" y="185" font-size="14">💰</text>
</svg>
