<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#F7931E"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="20" fill="url(#bg1)"/>
  <rect x="5" y="5" width="190" height="190" rx="17" fill="none" stroke="#fff" stroke-width="3" opacity="0.5"/>
  
  <!-- Face -->
  <circle cx="100" cy="75" r="40" fill="#E8B88A" stroke="#333" stroke-width="2"/>
  <!-- Sunglasses -->
  <rect x="62" y="63" width="30" height="20" rx="5" fill="#111" stroke="#333" stroke-width="1.5"/>
  <rect x="108" y="63" width="30" height="20" rx="5" fill="#111" stroke="#333" stroke-width="1.5"/>
  <line x1="92" y1="73" x2="108" y2="73" stroke="#333" stroke-width="2"/>
  <line x1="62" y1="73" x2="52" y2="68" stroke="#333" stroke-width="2"/>
  <line x1="138" y1="73" x2="148" y2="68" stroke="#333" stroke-width="2"/>
  <!-- Sunglasses shine -->
  <rect x="66" y="66" width="8" height="4" rx="2" fill="#fff" opacity="0.3"/>
  <rect x="112" y="66" width="8" height="4" rx="2" fill="#fff" opacity="0.3"/>
  <!-- Mouth - smirk -->
  <path d="M 82 92 Q 100 105 118 92" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Mustache -->
  <path d="M 85 88 Q 100 95 115 88" fill="#333" stroke="#222" stroke-width="1"/>
  <!-- Hair -->
  <path d="M 60 60 Q 60 35 100 30 Q 140 35 140 60" fill="#222" stroke="#111" stroke-width="1"/>
  <!-- Eyebrows -->
  <line x1="65" y1="60" x2="88" y2="58" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <line x1="112" y1="58" x2="135" y2="60" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Hand pointing -->
  <circle cx="155" cy="95" r="8" fill="#E8B88A" stroke="#333" stroke-width="1.5"/>
  <rect x="145" y="92" width="15" height="6" rx="3" fill="#E8B88A" stroke="#333" stroke-width="1"/>
  
  <!-- Text -->
  <text x="100" y="140" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="15" font-weight="900" fill="#fff" filter="url(#shadow1)">25 DIN ME</text>
  <text x="100" y="160" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="14" font-weight="900" fill="#FFE43A" filter="url(#shadow1)">PAISA DOUBLE!</text>
  
  <!-- Sparkles -->
  <text x="20" y="30" font-size="16">✨</text>
  <text x="170" y="30" font-size="16">💰</text>
  <text x="15" y="180" font-size="14">💸</text>
  <text x="170" y="180" font-size="14">🤑</text>
</svg>
