<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D32F2F"/>
      <stop offset="100%" style="stop-color:#B71C1C"/>
    </linearGradient>
    <filter id="shadow3">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg3)"/>
  <rect x="4" y="4" width="192" height="192" rx="18" fill="none" stroke="#FFD700" stroke-width="3"/>
  
  <!-- Tough face -->
  <circle cx="100" cy="65" r="38" fill="#E8B88A" stroke="#333" stroke-width="2"/>
  <!-- Eyes - angry -->
  <line x1="78" y1="52" x2="90" y2="56" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="56" x2="122" y2="52" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <circle cx="85" cy="60" r="3.5" fill="#222"/>
  <circle cx="115" cy="60" r="3.5" fill="#222"/>
  <circle cx="86" cy="59" r="1" fill="#fff"/>
  <circle cx="116" cy="59" r="1" fill="#fff"/>
  <!-- Mouth - grin -->
  <path d="M 80 78 Q 100 90 120 78" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="78" x2="120" y2="78" stroke="#333" stroke-width="2"/>
  <!-- Scar -->
  <line x1="125" y1="55" x2="135" y2="70" stroke="#CC5555" stroke-width="2" stroke-linecap="round"/>
  <!-- Bandana -->
  <path d="M 62 48 Q 100 35 138 48" fill="#D32F2F" stroke="#AA0000" stroke-width="1.5"/>
  <rect x="130" y="42" width="18" height="8" rx="2" fill="#D32F2F" stroke="#AA0000" stroke-width="1" transform="rotate(20,139,46)"/>
  <!-- Hair -->
  <path d="M 62 52 Q 65 30 100 25 Q 135 30 138 52" fill="#111"/>
  
  <!-- Fist -->
  <g transform="translate(155,85)">
    <rect x="-12" y="-8" width="24" height="20" rx="6" fill="#E8B88A" stroke="#333" stroke-width="1.5"/>
    <line x1="-5" y1="-2" x2="5" y2="-2" stroke="#D4A07A" stroke-width="1"/>
    <line x1="-5" y1="3" x2="5" y2="3" stroke="#D4A07A" stroke-width="1"/>
    <line x1="-5" y1="8" x2="5" y2="8" stroke="#D4A07A" stroke-width="1"/>
  </g>
  
  <!-- Impact lines -->
  <line x1="30" y1="40" x2="18" y2="30" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="25" y1="55" x2="12" y2="52" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <line x1="170" y1="40" x2="182" y2="30" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="175" y1="55" x2="188" y2="52" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Text -->
  <text x="100" y="130" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="11" font-weight="900" fill="#FFD700" filter="url(#shadow3)">THAPPAD SE</text>
  <text x="100" y="150" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="12" font-weight="900" fill="#fff" filter="url(#shadow3)">DARR NAHI LAGTA</text>
  <text x="100" y="172" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="14" font-weight="900" fill="#FFD700" filter="url(#shadow3)">SAAHAB! 💪</text>
</svg>
