<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8E2DE2"/>
      <stop offset="100%" style="stop-color:#4A00E0"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg2)"/>
  <rect x="5" y="5" width="190" height="190" rx="17" fill="none" stroke="#fff" stroke-width="2" opacity="0.3"/>
  
  <!-- Broken heart -->
  <g transform="translate(100,70)">
    <path d="M 0 15 C -5 -10 -35 -15 -35 10 C -35 30 0 50 0 50 C 0 50 35 30 35 10 C 35 -15 5 -10 0 15 Z" fill="#FF3366" stroke="#CC0044" stroke-width="2"/>
    <!-- Crack -->
    <path d="M 0 -5 L 5 10 L -3 20 L 4 35 L 0 50" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Bandage -->
    <rect x="-12" y="8" width="24" height="10" rx="3" fill="#FFD4A8" stroke="#DEB088" stroke-width="1" transform="rotate(-15)"/>
    <line x1="-5" y1="11" x2="-5" y2="15" stroke="#DEB088" stroke-width="1" transform="rotate(-15)"/>
    <line x1="0" y1="11" x2="0" y2="15" stroke="#DEB088" stroke-width="1" transform="rotate(-15)"/>
    <line x1="5" y1="11" x2="5" y2="15" stroke="#DEB088" stroke-width="1" transform="rotate(-15)"/>
  </g>
  
  <!-- Sad face -->
  <circle cx="100" cy="55" r="12" fill="#FFE43A" stroke="#333" stroke-width="1.5"/>
  <circle cx="96" cy="52" r="1.5" fill="#333"/>
  <circle cx="104" cy="52" r="1.5" fill="#333"/>
  <path d="M 95 59 Q 100 56 105 59" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tear -->
  <path d="M 107 54 Q 109 58 107 60" fill="#4FC3F7" stroke="none"/>
  
  <!-- Text -->
  <text x="100" y="150" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="13" font-weight="900" fill="#fff" filter="url(#glow2)">AE DIL HAI</text>
  <text x="100" y="170" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="16" font-weight="900" fill="#FF6BFF" filter="url(#glow2)">MUSHKIL!</text>
  
  <text x="15" y="25" font-size="14">😭</text>
  <text x="170" y="25" font-size="14">💔</text>
  <text x="15" y="190" font-size="12">😢</text>
  <text x="175" y="190" font-size="12">🥺</text>
</svg>
